name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.2.0, matching Cargo.toml) also publishes a GitHub release for install.sh and
    # the in-app updater.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opstrellis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run fetch-model
      - run: npm run typecheck
      - run: npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            target: linux-x86_64
          - os: macos-15
            bundles: app,dmg
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - name: Installer and release regressions (fixture payloads)
        run: |
          python3 ../tests/test_installer.py
          python3 ../tests/test_release.py
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev libxdo-dev libssl-dev libsecret-1-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      # A release is built from scratch, never from a cache another run wrote.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: desktop/src-tauri
          # A cached build links against the sherpa-onnx libraries in ~/.cache/sherpa-onnx, so keep
          # them in the same entry.
          key: sherpa-onnx-2.0.1-verified
          cache-directories: ~/.cache/sherpa-onnx
      - name: sherpa-onnx libraries
        # rust-cache empties unknown folders under target/ before saving, which would leave
        # sherpa-onnx-sys's own download empty, so keep the libraries outside target/ and point the
        # build at them. The version must match the sherpa-onnx crate in src-tauri/Cargo.toml.
        run: |
          # Digests from GitHub's release assets: these libraries are linked into the published app.
          case "$RUNNER_OS" in
            Linux) name=sherpa-onnx-v2.0.1-linux-x64-shared-lib sha=532c45bbd41036d83cd70606797529aa8086c2053395a58967736c727625b120 ;;
            macOS) name=sherpa-onnx-v2.0.1-osx-arm64-static-lib sha=d7a9b14f337958e7373c8c650f046df33d210bbaff2f33cb8322dda663ee5e1c ;;
          esac
          dir="$HOME/.cache/sherpa-onnx"
          if [ ! -d "$dir/$name/lib" ]; then
            mkdir -p "$dir"
            curl -fsSL -o "$RUNNER_TEMP/$name.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$name.tar.bz2"
            echo "$sha  $RUNNER_TEMP/$name.tar.bz2" | shasum -a 256 -c -
            tar xjf "$RUNNER_TEMP/$name.tar.bz2" -C "$dir" && rm "$RUNNER_TEMP/$name.tar.bz2"
          fi
          echo "SHERPA_ONNX_LIB_DIR=$dir/$name/lib" >> "$GITHUB_ENV"
      - name: Put the sherpa-onnx libraries next to the builds (Linux)
        # sherpa-onnx-sys copies its .so files into target/<profile>/, which rust-cache prunes, and a
        # cached build doesn't rerun that copy. The tests load them from there and the bundle ships them.
        if: runner.os == 'Linux'
        run: |
          for profile in debug release; do
            mkdir -p src-tauri/target/$profile
            cp "$SHERPA_ONNX_LIB_DIR"/*.so* src-tauri/target/$profile/
          done
      - run: npm ci
      - run: npm run build
      - name: Unit tests (with the real local model for the fallback test)
        run: |
          mkdir -p /tmp/opstrellis-models && cd /tmp/opstrellis-models
          # GitHub has no published digest for this older asset, so it can't be pinned yet.
          curl -fsSL -o moonshine.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-moonshine-tiny-en-int8.tar.bz2
          tar xjf moonshine.tar.bz2 && rm moonshine.tar.bz2
          touch sherpa-onnx-moonshine-tiny-en-int8/.complete
          cd "$GITHUB_WORKSPACE/desktop/src-tauri" && cargo test
      - name: Bundle
        # Every build makes the signed updater artifacts the in-app updater installs: the AppImage's
        # .sig, and macOS's OpsTrellis.app.tar.gz with its .sig. Release tags sign with the real key.
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          config='{"bundle":{"createUpdaterArtifacts":true}}'
          if [ "$RELEASE_TAG" != true ]; then
            # Not a release: signed with a throwaway key nobody keeps (and never uploaded), and that
            # build trusts only it. Needs no secret, so fork PRs work.
            npx tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway-updater.key" >/dev/null
            export TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/throwaway-updater.key"
            config="{\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$(cat "$RUNNER_TEMP/throwaway-updater.key.pub")\"}}}"
          fi
          npx tauri build --bundles ${{ matrix.bundles }} --config "$config"
      - name: Installer asset (fixed name, as install.sh expects)
        env: { INSTALLER_TARGET: "${{ matrix.target }}" }
        run: |
          # Fail instead of publishing a mislabeled binary if a runner image changes architecture.
          case "$INSTALLER_TARGET:$(uname -m)" in
            linux-x86_64:x86_64|macos-aarch64:arm64) ;;
            *) echo "Unexpected runner architecture"; exit 1 ;;
          esac
          mkdir -p release
          bundle=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = Linux ]; then
            asset=release/opstrellis-${{ matrix.target }}.AppImage
            cp $bundle/appimage/*.AppImage "$asset"
            cp $bundle/appimage/*.AppImage.sig "$asset.sig"
          else
            # Tauri's own archive (OpsTrellis.app at its top, symlinks and permissions kept, which the
            # artifact zip would drop). The .sig signs these exact bytes.
            asset=release/opstrellis-${{ matrix.target }}.app.tar.gz
            cp $bundle/macos/OpsTrellis.app.tar.gz "$asset"
            cp $bundle/macos/OpsTrellis.app.tar.gz.sig "$asset.sig"
          fi
          python3 ../.github/scripts/latest_json.py --check "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)" "$asset"
      - name: Install and rerun the native bundle before publishing
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: |
          OPSTRELLIS_TEST_ASSET="$(find "$PWD/release" -type f ! -name '*.sig' | head -1)"
          OPSTRELLIS_TEST_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          export OPSTRELLIS_TEST_ASSET OPSTRELLIS_TEST_VERSION
          python3 ../tests/test_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: opstrellis-${{ runner.os }}
          path: |
            desktop/release/*
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(grep -m1 '^version' desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir dist
          find artifacts -type f \( -name 'opstrellis-*' -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} dist/ \;
          # Refuse incomplete releases even if an upload/download step lost an asset.
          test -s dist/opstrellis-linux-x86_64.AppImage
          test -s dist/opstrellis-macos-aarch64.app.tar.gz
          test -s dist/opstrellis-linux-x86_64.AppImage.sig
          test -s dist/opstrellis-macos-aarch64.app.tar.gz.sig
          test "$(find dist -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -name '*.dmg' | wc -l)" -eq 1
          # The in-app updater's manifest. Apps read it through releases/latest/download/, which
          # never serves a pre-release's.
          python3 .github/scripts/latest_json.py "$GITHUB_REF_NAME" dist
          (cd dist && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)
          extra=()
          case "$GITHUB_REF_NAME" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpsTrellis $GITHUB_REF_NAME" --generate-notes --verify-tag ${extra[@]+"${extra[@]}"}

  install-test:
    # Installs the published release with install.sh on each OS, then reruns it as an update would.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPSTRELLIS_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: bash install.sh
      - run: bash install.sh
      - name: Graphics library every Linux desktop has (AppImages leave it to the system)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: opstrellis --version reports the release
        # Lets the AppImage run without FUSE, in case the runner lacks it.
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: test "$(~/.local/bin/opstrellis --version)" = "opstrellis ${GITHUB_REF_NAME#v}"
